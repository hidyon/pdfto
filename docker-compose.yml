services:
  pdfto:
    build: .
    image: pdfto
    ports:
      - "8000:8000"
    volumes:
      - pdfto-data:/data
    environment:
      # Override defaults here if needed, e.g.:
      # PDFTO_TTL_MINUTES: "120"
      # PDFTO_MAX_WORKERS: "4"
      PDFTO_DATA_DIR: /data
    restart: unless-stopped

volumes:
  pdfto-data:
