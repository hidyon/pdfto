[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfto-client"
version = "0.1.0"
description = "Dependency-free Python client for the PDFto API (PDF → Markdown/HTML/JSON/text)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "PDFto" }]
keywords = ["pdf", "markdown", "docling", "conversion", "client"]
dependencies = []

[project.urls]
Homepage = "https://github.com/hidyon/pdfto"
Source = "https://github.com/hidyon/pdfto/tree/main/client/python"

[tool.setuptools]
py-modules = ["pdfto_client"]
