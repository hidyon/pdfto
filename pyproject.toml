[project]
name = "pdfto"
version = "0.1.0"
description = "Convert PDF documents into Markdown, HTML, JSON or text — API-first, with an interactive web UI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.115",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
    "docling>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
